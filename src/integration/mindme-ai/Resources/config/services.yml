services:
    Claroline\MindMeAiBundle\Controller\AiGeneratorController:
        tags: ['controller.service_arguments']
        arguments:
            - '@Claroline\AppBundle\Persistence\ObjectManager'
            - '@translator'
            - '@security.token_storage'
            - '@Claroline\CoreBundle\Library\Configuration\PlatformConfigurationHandler'
            - '@Claroline\MindMeAiBundle\Security\SecretCipher'
    Claroline\MindMeAiBundle\Manager\DashboardStatsManager:
        arguments:
            - '@Claroline\AppBundle\Persistence\ObjectManager'
            - '@security.token_storage'
            - '@Claroline\CoreBundle\Library\Configuration\PlatformConfigurationHandler'
    Claroline\MindMeAiBundle\Serializer\AiLessonSerializer:
        tags: ['claroline.serializer']
        arguments:
            - '@Claroline\AppBundle\Persistence\ObjectManager'
            - '@Claroline\MindMeAiBundle\Security\SecretCipher'
    Claroline\MindMeAiBundle\Serializer\MindmeMarkdownSerializer:
        tags: ['claroline.serializer']
    Claroline\MindMeAiBundle\Serializer\ResourcePricingSerializer:
        tags: ['claroline.serializer']
    Claroline\MindMeAiBundle\Serializer\DashboardWidgetSerializer:
        tags: ['claroline.serializer']
        arguments:
            - '@Claroline\MindMeAiBundle\Manager\DashboardStatsManager'
    Claroline\MindMeAiBundle\Serializer\ResourceReferenceSerializer:
        tags: ['claroline.serializer']
        arguments:
            - '@Claroline\CoreBundle\API\Serializer\Resource\ResourceNodeSerializer'
    Claroline\MindMeAiBundle\Controller\ResourceReferenceController:
        tags: ['controller.service_arguments']
        arguments:
            - '@Claroline\AppBundle\Persistence\ObjectManager'
            - '@Claroline\MindMeAiBundle\Serializer\ResourceReferenceSerializer'
            - '@security.authorization_checker'
            - '@security.token_storage'
    Claroline\MindMeAiBundle\Security\SecretCipher:
        arguments:
            - '%kernel.secret%'
    Claroline\MindMeAiBundle\Configuration\PlatformDefaults:
        tags: ['claroline.configuration']
    Claroline\MindMeAiBundle\Neuron\NeuronAiFactory:
        arguments:
            - '@Claroline\AppBundle\Persistence\ObjectManager'
            - '@Claroline\MindMeAiBundle\Security\SecretCipher'
    Claroline\MindMeAiBundle\Tools\ListCoursesTool: ~
    Claroline\MindMeAiBundle\Tools\SearchResourcesTool: ~
    Claroline\MindMeAiBundle\Tools\GetUserProgressTool: ~
    Claroline\MindMeAiBundle\Tools\GetResourceContentTool: ~
    Claroline\MindMeAiBundle\Tools\CreateResourceTool: ~
    Claroline\MindMeAiBundle\Tools\GradeAssignmentTool: ~
    Claroline\MindMeAiBundle\Agent\TeachingAgent:
        arguments:
            $factory: '@Claroline\MindMeAiBundle\Neuron\NeuronAiFactory'
            $injectedTools:
                - '@Claroline\MindMeAiBundle\Tools\ListCoursesTool'
                - '@Claroline\MindMeAiBundle\Tools\SearchResourcesTool'
                - '@Claroline\MindMeAiBundle\Tools\GetUserProgressTool'
                - '@Claroline\MindMeAiBundle\Tools\GetResourceContentTool'
                - '@Claroline\MindMeAiBundle\Tools\CreateResourceTool'
                - '@Claroline\MindMeAiBundle\Tools\GradeAssignmentTool'
