services:
    Mindme\AibaseBundle\Controller\AibaseChatController:
        tags: ['controller.service_arguments']
        arguments:
            - '@Claroline\AppBundle\Persistence\ObjectManager'
            - '@security.authorization_checker'
            - '@Mindme\AibaseBundle\Library\SecretCipher'
            - '@security.token_storage'
            - '@Claroline\CoreBundle\Library\Configuration\PlatformConfigurationHandler'
            - '@Mindme\AibaseBundle\Library\TTS\NullTTSProvider'
            - '@Mindme\AibaseBundle\Library\TTS\EdgeTTSProvider'

    Mindme\AibaseBundle\Controller\AibaseContextController:
        tags: ['controller.service_arguments']
        arguments:
            - '@Claroline\AppBundle\Persistence\ObjectManager'
            - '@security.authorization_checker'

    Mindme\AibaseBundle\Controller\ResourceReferenceController:
        tags: ['controller.service_arguments']
        arguments:
            - '@Claroline\AppBundle\Persistence\ObjectManager'
            - '@Mindme\AibaseBundle\Serializer\ResourceReferenceSerializer'
            - '@security.authorization_checker'
            - '@security.token_storage'