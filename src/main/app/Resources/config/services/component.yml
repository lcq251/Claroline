# Declares all services required for the management of Claroline Components (e.g. tools, resources, widgets).
services:
    # Contexts
    Claroline\AppBundle\Component\Context\ContextProvider:
        lazy: true
        arguments:
            - !tagged_iterator claroline.component.context
            - '@security.token_storage'
            - '@Claroline\AppBundle\Persistence\ObjectManager'
            - '@Claroline\AppBundle\API\SerializerProvider'

    claroline.provider.context:
        alias: Claroline\AppBundle\Component\Context\ContextProvider
        public: true

    Claroline\AppBundle\Component\Context\ContextComponent:
        abstract: true

    # Tools
    Claroline\AppBundle\Component\Tool\ToolProvider:
        lazy: true
        arguments:
            - !tagged_iterator claroline.component.tool
            - '@event_dispatcher'
            - '@Claroline\AppBundle\Persistence\ObjectManager'
            - '@Claroline\AppBundle\API\SerializerProvider'
            - '@Claroline\AppBundle\API\Crud'

    claroline.provider.tool:
        alias: Claroline\AppBundle\Component\Tool\ToolProvider
        public: true

    Claroline\AppBundle\Component\Tool\ToolComponent:
        abstract: true

    # DataSources
    Claroline\AppBundle\Component\DataSource\DataSourceProvider:
        lazy: true
        arguments:
            - !tagged_iterator claroline.component.data_source

    claroline.provider.data_source:
        alias: Claroline\AppBundle\Component\DataSource\DataSourceProvider
        public: true

    Claroline\AppBundle\Component\DataSource\DataSourceComponent:
        abstract: true

    Claroline\AppBundle\Component\DataSource\ListSourceComponent:
        abstract: true
