plugin:
    resources:
        - name: file
          class: Claroline\CoreBundle\Entity\Resource\File

        - name: directory
          class: Claroline\CoreBundle\Entity\Resource\Directory

    tools:
        - name: workspaces
          icon: book
          tool_rights:
              - archive
              - create

        - name: resources
          icon: folder

        - name: locations
          icon: map-marker-alt

        - name: parameters
          icon: cog

        - name: integration
          icon: plug

    widgets:
        - name: simple
          class: Claroline\CoreBundle\Entity\Widget\Type\SimpleWidget
          context: [workspace, desktop, public, administration]
          tags: [content]

        - name: list
          class: Claroline\CoreBundle\Entity\Widget\Type\ListWidget
          context: [workspace, desktop, public, administration]
          sources: [list]

        - name: resource
          class: Claroline\CoreBundle\Entity\Widget\Type\ResourceWidget
          context: [workspace, desktop, public, administration]
          sources: [resource]

    data_sources:
        - name: resources
          type: list
          context: [workspace, desktop, public, administration]
          tags: [content]

        - name: resource
          type: resource
          context: [workspace, desktop, public, administration]
          tags: [content]

        - name: personal_workspace
          type: resource
          context: [desktop, administration]
          tags: [content]

        - name: workspaces
          type: list
          context: [desktop, workspace, public, administration]
          tags: [content]

        - name: my_workspaces
          type: list
          context: [desktop, workspace, administration]
          tags: [content]

        - name: admin_tools
          type: list
          context: [administration]
          tags: [structure]

        - name: tools
          type: list
          context: [desktop, workspace]
          tags: [structure]
