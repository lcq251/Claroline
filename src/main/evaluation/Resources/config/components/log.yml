services:
    Claroline\EvaluationBundle\Component\Log\Functional\LogResourceAttemptEnd:
        parent: Claroline\LogBundle\Component\Log\AbstractFunctionalLog
        tags: [ 'claroline.component.log' ]

    Claroline\EvaluationBundle\Component\Log\Functional\LogResourceAttemptGive:
        parent: Claroline\LogBundle\Component\Log\AbstractFunctionalLog
        tags: [ 'claroline.component.log' ]

    Claroline\EvaluationBundle\Component\Log\Functional\LogResourceAttemptStart:
        parent: Claroline\LogBundle\Component\Log\AbstractFunctionalLog
        tags: [ 'claroline.component.log' ]

    Claroline\EvaluationBundle\Component\Log\Functional\LogResourceEvaluationEnd:
        parent: Claroline\LogBundle\Component\Log\AbstractFunctionalLog
        tags: [ 'claroline.component.log' ]

    Claroline\EvaluationBundle\Component\Log\Functional\LogResourceEvaluationStart:
        parent: Claroline\LogBundle\Component\Log\AbstractFunctionalLog
        tags: [ 'claroline.component.log' ]

    Claroline\EvaluationBundle\Component\Log\Functional\LogWorkspaceEvaluationEnd:
        parent: Claroline\LogBundle\Component\Log\AbstractFunctionalLog
        tags: [ 'claroline.component.log' ]

    Claroline\EvaluationBundle\Component\Log\Functional\LogWorkspaceEvaluationStart:
        parent: Claroline\LogBundle\Component\Log\AbstractFunctionalLog
        tags: [ 'claroline.component.log' ]

    # Operational
    Claroline\EvaluationBundle\Component\Log\Operational\LogSequence:
        parent: Claroline\LogBundle\Component\Log\AbstractOperationalLog
        tags: [ 'claroline.component.log' ]
        arguments:
            - '@Claroline\CoreBundle\Library\RoutingHelper'