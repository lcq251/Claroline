plugin:
    tools:
        - name: progression
          icon: route

    data_sources:
        - name: resource_attempts
          type: list
          context: [ workspace, desktop ]
          tags: [ activity, content ]

        - name: resource_evaluations
          type: list
          context: [ workspace, desktop ]
          tags: [ activity, content ]

        - name: my_resource_evaluations
          type: list
          context: [ workspace, desktop ]
          tags: [ activity ]

        - name: workspace_evaluations
          type: list
          context: [ workspace, desktop ]
          tags: [ content ]

        - name: my_workspace_evaluations
          type: list
          context: [ desktop ]
          tags: [ activity ]

    templates:
        - name: evaluation_participation_certificate
          type: pdf
          placeholders:
              - evaluated_content_name
              - evaluated_content_code
              - evaluated_content_description
              - evaluated_content_poster
              - user_first_name
              - user_last_name
              - user_username
              - evaluation_duration
              - evaluation_status
              - evaluation_last_activity_datetime_utc
              - evaluation_last_activity_date_utc
              - evaluation_last_activity_time_utc
              - evaluation_last_activity_datetime
              - evaluation_last_activity_date
              - evaluation_last_activity_time
              - evaluation_start_datetime_utc
              - evaluation_start_date_utc
              - evaluation_start_time_utc
              - evaluation_start_datetime
              - evaluation_start_date
              - evaluation_start_time
              - evaluation_end_datetime_utc
              - evaluation_end_date_utc
              - evaluation_end_time_utc
              - evaluation_end_datetime
              - evaluation_end_date
              - evaluation_end_time

        - name: evaluation_success_certificate
          type: pdf
          placeholders:
              - evaluated_content_name
              - evaluated_content_code
              - evaluated_content_description
              - evaluated_content_poster
              - user_first_name
              - user_last_name
              - user_username
              - evaluation_duration
              - evaluation_status
              - evaluation_last_activity_datetime_utc
              - evaluation_last_activity_date_utc
              - evaluation_last_activity_time_utc
              - evaluation_last_activity_datetime
              - evaluation_last_activity_date
              - evaluation_last_activity_time
              - evaluation_start_datetime_utc
              - evaluation_start_date_utc
              - evaluation_start_time_utc
              - evaluation_start_datetime
              - evaluation_start_date
              - evaluation_start_time
              - evaluation_end_datetime_utc
              - evaluation_end_date_utc
              - evaluation_end_time_utc
              - evaluation_end_datetime
              - evaluation_end_date
              - evaluation_end_time
              - evaluation_score
              - evaluation_score_max

        - name: workspace_participation_certificate
          type: pdf
          placeholders:
              - workspace_name
              - workspace_code
              - workspace_description
              - workspace_poster
              - user_first_name
              - user_last_name
              - user_username
              - evaluation_duration
              - evaluation_status
              - evaluation_datetime
              - evaluation_date
              - evaluation_time

        - name: workspace_success_certificate
          type: pdf
          placeholders:
              - workspace_name
              - workspace_code
              - workspace_description
              - workspace_poster
              - user_first_name
              - user_last_name
              - user_username
              - evaluation_duration
              - evaluation_status
              - evaluation_datetime
              - evaluation_date
              - evaluation_time
              - evaluation_score
              - evaluation_score_max
