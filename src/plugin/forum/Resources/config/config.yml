plugin:
    resources:
        - name: claroline_forum
          class: Claroline\ForumBundle\Entity\Forum
          resource_rights:
              - post
              
    data_sources:
        - name: forum_messages
          type: list
          context: [workspace, desktop, public]
          tags: [community]

    templates:
        - name: forum_new_message
          type: email
          placeholders:
              - forum
              - forum_url
              - subject
              - subject_url
              - message
              - post_datetime_utc
              - post_date_utc
              - post_time_utc
              - post_datetime
              - post_date
              - post_time
              - author
              - workspace
              - workspace_url
