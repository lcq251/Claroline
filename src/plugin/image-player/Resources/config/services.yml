services:
    Claroline\ImagePlayerBundle\Controller\ImageController:
        public: true
        arguments:
            - '@security.authorization_checker'
            - '@Claroline\AppBundle\Persistence\ObjectManager'
            - '@Claroline\CoreBundle\Manager\FileManager'

    Claroline\ImagePlayerBundle\Manager\EvaluationManager:
        arguments:
            - '@Claroline\EvaluationBundle\Manager\ResourceEvaluationManager'

    Claroline\ImagePlayerBundle\Serializer\ImageSerializer:
        tags: [claroline.serializer]

    # Updaters
    Claroline\ImagePlayerBundle\Installation\Updater\Updater150000:
        tags: [ 'claroline.platform.updater' ]
        arguments:
            - '@doctrine.dbal.default_connection'
            - '@Claroline\AppBundle\Persistence\ObjectManager'
