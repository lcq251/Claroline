services:
    # Controllers
    Claroline\PdfPlayerBundle\Controller\PdfController:
        public: true # because controller
        arguments:
            - '@security.authorization_checker'
            - '@Claroline\AppBundle\Persistence\ObjectManager'
            - '@Claroline\AppBundle\API\SerializerProvider'
            - '@Claroline\CoreBundle\Manager\FileManager'
            - '@Claroline\PdfPlayerBundle\Manager\EvaluationManager'

    # Managers
    Claroline\PdfPlayerBundle\Manager\EvaluationManager:
        arguments:
            - '@Claroline\AppBundle\Persistence\ObjectManager'
            - '@Claroline\EvaluationBundle\Manager\ResourceEvaluationManager'

    # Serializers
    Claroline\PdfPlayerBundle\Serializer\PdfSerializer:
        tags: [ claroline.serializer ]

    # Updaters
    Claroline\PdfPlayerBundle\Installation\Updater\Updater150000:
        tags: [ 'claroline.platform.updater' ]
        arguments:
            - '@doctrine.dbal.default_connection'
            - '@Claroline\AppBundle\Persistence\ObjectManager'
