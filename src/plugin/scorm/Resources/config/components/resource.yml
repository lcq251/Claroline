services:
    Claroline\ScormBundle\Component\Resource\ScormResource:
        tags: [ 'claroline.component.resource', 'kernel.event_subscriber' ]
        arguments:
            - '@security.token_storage'
            - '@Claroline\AppBundle\Persistence\ObjectManager'
            - '@Claroline\AppBundle\API\SerializerProvider'
            - '@Claroline\ScormBundle\Manager\ScormManager'
            - '@Claroline\ScormBundle\Manager\EvaluationManager'
            - '@Claroline\CoreBundle\Manager\FileManager'
            - '%claroline.param.uploads_directory%'
